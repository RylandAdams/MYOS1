		<!-- Boot: in-app browser fixes (Instagram bio links use a separate WebView cache) -->
		<script>
			(function () {
				var ua = navigator.userAgent || '';
				var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Twitter|Line\//i.test(ua);
				window.__MYOS_IN_APP_BROWSER = inApp;

				function purgeCaches() {
					var tasks = [];
					if ('serviceWorker' in navigator) {
						tasks.push(
							navigator.serviceWorker.getRegistrations().then(function (regs) {
								regs.forEach(function (reg) { reg.unregister(); });
							})
						);
					}
					if ('caches' in window) {
						tasks.push(
							caches.keys().then(function (keys) {
								return Promise.all(keys.map(function (k) { return caches.delete(k); }));
							})
						);
					}
					return Promise.all(tasks);
				}

				if (inApp) {
					window.__MYOS_PURGE_READY = purgeCaches();
				}

				// Stale IG cache can serve old index.html → missing JS → HTML error page
				window.addEventListener(
					'error',
					function (ev) {
						var t = ev.target;
						if (!t || t.tagName !== 'SCRIPT' || !t.src || window.__MYOS_SCRIPT_RETRY) return;
						window.__MYOS_SCRIPT_RETRY = true;
						purgeCaches().finally(function () {
							var u = new URL(window.location.href);
							u.searchParams.set('_cb', String(Date.now()));
							window.location.replace(u.toString());
						});
					},
					true
				);
			})();
		</script>

		<!-- In-app browsers (Instagram) cache old index.html with stale /static/* hashes.
		     Missing bundles fall through to SPA rewrite → HTML instead of JS. Load fresh
		     entrypoints from asset-manifest.json before deferred scripts execute. -->
		<script>
			(function () {
				if (!window.__MYOS_IN_APP_BROWSER) return;

				var scripts = document.querySelectorAll('script[src*="/static/js/"]');
				var links = document.querySelectorAll('link[href*="/static/css/"]');
				for (var i = 0; i < scripts.length; i++) scripts[i].parentNode.removeChild(scripts[i]);
				for (var j = 0; j < links.length; j++) links[j].parentNode.removeChild(links[j]);

				var bust = String(Date.now());

				function reloadOnce() {
					if (window.__MYOS_MANIFEST_RETRY) return;
					window.__MYOS_MANIFEST_RETRY = true;
					var purge = window.__MYOS_PURGE_READY || Promise.resolve();
					purge.finally(function () {
						var u = new URL(window.location.href);
						u.searchParams.set('_cb', String(Date.now()));
						window.location.replace(u.toString());
					});
				}

				fetch('/asset-manifest.json?v=' + bust, { cache: 'no-store' })
					.then(function (res) {
						if (!res.ok) throw new Error('manifest fetch failed');
						return res.json();
					})
					.then(function (manifest) {
						var files = manifest && manifest.files;
						var mainJs = files && files['main.js'];
						var mainCss = files && files['main.css'];
						if (!mainJs) throw new Error('main.js missing from manifest');

						if (mainCss) {
							var link = document.createElement('link');
							link.rel = 'stylesheet';
							// hashed file names are immutable – the fresh manifest already gives the current one,
							// so no cache-busting query: the file is fetched once and cached
							link.href = mainCss.split('?')[0];
							document.head.appendChild(link);
						}

						var script = document.createElement('script');
						script.defer = true;
						script.src = mainJs.split('?')[0];
						script.onerror = reloadOnce;
						document.head.appendChild(script);
					})
					.catch(reloadOnce);
			})();
		</script>
